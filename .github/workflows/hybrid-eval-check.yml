name: Temporary hybrid evaluation verification

on:
  push:
    branches: [feat/rrf-hybrid-eval]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run evaluator
        run: |
          node hybrid-eval.js | tee /tmp/hybrid-output.txt
          grep -F "| **Summary** | **MRR 0.33 · Recall@10 0.60** | **MRR 0.67 · Recall@10 1.00** | **MRR 0.90 · Recall@10 1.00** |" /tmp/hybrid-output.txt
          grep -F "| how do I add semantic search to a table I already have | 12 | 2 | 1 |" /tmp/hybrid-output.txt
          grep -F "| why did my query get slower after I added an index | 14 | 1 | 2 |" /tmp/hybrid-output.txt
